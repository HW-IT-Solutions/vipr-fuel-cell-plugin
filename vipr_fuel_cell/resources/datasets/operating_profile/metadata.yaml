schema_version: 1
id: operating_profile
title: PEMFC operating-state reconstruction profile
description: >-
  Simulated PEMFC sensor time series used to demonstrate uncertainty-aware
  reconstruction of operating parameters with a conditional invertible neural
  network.
source:
  type: validated PEMFC simulation model
  publication: Conditional invertible neural network for online-capable monitoring of polymer electrolyte membrane fuel cells
  doi: https://doi.org/10.1016/j.ijhydene.2026.155929
time:
  column: time_s
  label: Time
  unit: s
conditions:
  - name: U_cell_V
    column: cell_voltage_V
    label: Cell voltage
    unit: V
  - name: E_Con
    column: concentration_loss_V
    label: Concentration loss
    unit: V
  - name: E_Ohm
    column: ohmic_loss_V
    label: Ohmic loss
    unit: V
  - name: E_Cross
    column: crossover_loss_V
    label: Hydrogen crossover loss
    unit: V
  - name: E_act
    column: activation_loss_V
    label: Activation loss
    unit: V
  - name: Imax_An_fit
    column: anode_limiting_current_density_A_cm2
    label: Anode limiting current density
    unit: A/cm²
  - name: Imax_Kath_fit
    column: cathode_limiting_current_density_A_cm2
    label: Cathode limiting current density
    unit: A/cm²
  - name: N_flux_H2O_th_An
    column: anode_water_flux_mol_m2_s
    label: Anode water flux
    unit: mol/(m² s)
  - name: N_flux_H2O_th_Kath
    column: cathode_water_flux_mol_m2_s
    label: Cathode water flux
    unit: mol/(m² s)
  - name: N_flux_H2_th_An
    column: anode_hydrogen_flux_mol_m2_s
    label: Anode hydrogen flux
    unit: mol/(m² s)
  - name: N_flux_O2_th_Kath
    column: cathode_oxygen_flux_mol_m2_s
    label: Cathode oxygen flux
    unit: mol/(m² s)
references:
  - name: J_Cell_A_cm2
    label: Cell current density
    value: 1.2
    unit: A/cm²
  - name: RH_In_An_Ist
    label: Anode inlet relative humidity
    value: 0.8
    unit: "1"
  - name: RH_In_Cath_Ist
    label: Cathode inlet relative humidity
    value: 0.75
    unit: "1"
  - name: T_In_An_Ist
    label: Anode inlet temperature
    value: 343.15
    unit: K
  - name: T_In_Cath_Ist
    label: Cathode inlet temperature
    value: 343.15
    unit: K
  - name: p_In_An_Ist
    label: Anode inlet pressure
    value: 2.0
    unit: atm
  - name: p_In_Cath_Ist
    label: Cathode inlet pressure
    value: 1.8
    unit: atm
  - name: Stoech_In_H2_An_Ist
    label: Hydrogen stoichiometry
    value: 1.3
    unit: "1"
  - name: Stoech_In_O2_Cath_Ist
    label: Oxygen stoichiometry
    value: 1.8
    unit: "1"
