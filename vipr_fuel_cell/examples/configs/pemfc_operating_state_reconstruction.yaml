# Uncertainty-aware reconstruction of PEMFC operating parameters from a
# packaged sensor profile and the verified model bundle in this repository.
# No model registry is required.
vipr:
  inference:
    filters:
      INFERENCE_PREPROCESS_PRE_FILTER:
        - class: vipr_fuel_cell.preprocess.condition_preprocessor.PEMFCConditionPreprocessor
          method: preprocess_conditions
          enabled: true
          weight: 0
          parameters:
            invalid_rows: drop
            out_of_range: warn
    load_data:
      handler: pemfc_dataset
      parameters:
        data_path: "@vipr_fuel_cell/resources/datasets/operating_profile/sensor_data.csv"
        profile_path: "@vipr_fuel_cell/resources/datasets/operating_profile/profile.yaml"
    load_model:
      handler: pemfc_cinn
      parameters:
        model_dir: ../../../models/test_case_1
        device: cpu
    preprocess:
      handler: ""
      parameters: {}
    prediction:
      handler: pemfc_posterior
      parameters:
        num_samples: 1000
        seed: 42
        quantiles: [0.025, 0.5, 0.975]
        time_batch_size: 8
        common_latent_samples: true
        # One illustrative stable operating point before the pressure change.
        # Index 40 maps to simulation step 41 after dropping the initial row.
        posterior_snapshot_indices: [40]
        histogram_bins: 30
    postprocess:
      handler: ""
      parameters: {}
  result_id: pemfc-operating-state-reconstruction
