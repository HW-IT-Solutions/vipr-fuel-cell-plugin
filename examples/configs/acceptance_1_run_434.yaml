# Local reproducibility configuration for HZwo-DigiTwin acceptance scenarios 1/2.
# Paths are relative to this YAML file and point to the sibling project in the
# current development workspace. Adjust them for another installation.
vipr:
  inference:
    filters:
      INFERENCE_PREPROCESS_PRE_FILTER:
        - class: vipr_fuel_cell.preprocess.condition_preprocessor.PEMFCConditionPreprocessor
          method: preprocess_conditions
          enabled: true
          weight: 0
          parameters:
            invalid_rows: drop
            out_of_range: warn
    load_data:
      handler: pemfc_mat
      parameters:
        data_path: ../../../../saxonyai/iwu-datenmodellierung-digitale-zwilllinge-brennstoffzelle/data/acceptance_sample/Abnahmebsp1_conv.mat
        reference_path: ../../../../saxonyai/iwu-datenmodellierung-digitale-zwilllinge-brennstoffzelle/data/acceptance_sample/INI1.txt
        condition_names:
          - U_cell_V
          - E_Con
          - E_Ohm
          - E_Cross
          - E_act
          - Imax_An_fit
          - Imax_Kath_fit
          - N_flux_H2O_th_An
          - N_flux_H2O_th_Kath
          - N_flux_H2_th_An
          - N_flux_O2_th_Kath
    load_model:
      handler: pemfc_cinn
      parameters:
        checkpoint_path: ../../../../saxonyai/iwu-datenmodellierung-digitale-zwilllinge-brennstoffzelle/data/models/cinn/run_434/checkpoints/last.ckpt
        scaler_x_path: ../../../../saxonyai/iwu-datenmodellierung-digitale-zwilllinge-brennstoffzelle/data/models/cinn/run_434/scalers/scaler_x.json
        scaler_y_path: ../../../../saxonyai/iwu-datenmodellierung-digitale-zwilllinge-brennstoffzelle/data/models/cinn/run_434/scalers/scaler_y.json
        device: cpu
    preprocess:
      handler: ''
      parameters: {}
    prediction:
      handler: pemfc_posterior
      parameters:
        num_samples: 1000
        seed: 42
        quantiles: [0.025, 0.5, 0.975]
        time_batch_size: 8
        common_latent_samples: true
    postprocess:
      handler: ''
      parameters: {}
  result_id: pemfc-acceptance-1-run-434
